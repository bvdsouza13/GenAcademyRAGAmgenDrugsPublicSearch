<text x="82" y="990" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#153B5C" font-weight="400" text-anchor="start">Retained snapshots and manifests keep old conversations resolvable. Semantic and lexical versions activate together.</text>
<text x="82" y="1019" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#153B5C" font-weight="400" text-anchor="start">Shared hosting is outside scope: it needs server-enforced roles, durable shared storage, learner isolation and operational recovery.</text>
