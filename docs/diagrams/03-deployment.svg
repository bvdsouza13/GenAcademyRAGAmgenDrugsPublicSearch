<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">Local deployment design</title>
<desc id="desc">One local Python process, durable local evidence, and two server-side HTTPS integrations Implemented local architecture. Source-fidelity pilot is published; broad clinical review remains separate.</desc>
