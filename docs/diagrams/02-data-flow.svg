<text x="85" y="1046" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4D667B" font-weight="400" text-anchor="start">Missing or conflicting evidence produces a visible limitation. Citations resolve against the retained build and original PDF.</text>
<rect x="60" y="1100" width="1560" height="93" rx="12" fill="#FFF5DF" stroke="#E7C990" stroke-width="1.5"/>
<text x="82" y="1134" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#153B5C" font-weight="400" text-anchor="start">Remote payloads: Pinecone receives reviewed chunk text + compact metadata; OpenAI receives the question + retrieved excerpts.</text>
<text x="82" y="1163" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#153B5C" font-weight="400" text-anchor="start">Original PDFs and canonical XML remain local. A verified six-chunk pilot is published; broader source review remains required.</text>
<text x="60" y="1214" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4D667B" font-weight="400" text-anchor="start">LOCAL IMPLEMENTATION  •  11 NOV 2026  •  Blue = application / service exchange; amber = review or current-state constraint</text>
