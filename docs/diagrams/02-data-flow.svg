<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
<title id="title">Data flow</title>
<desc id="desc">Two separate flows: operator-controlled publication and a scoped, cited answer Implemented local architecture. Source-fidelity pilot is published; broad clinical review remains separate.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#0063C3"/></marker></defs>
<style>text { font-family: Helvetica, Arial, sans-serif; } .body { font-size: 19px; } </style>
