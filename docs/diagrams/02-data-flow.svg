<rect width="1680" height="12" fill="#0063C3"/>
<text x="60" y="58" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0063C3" font-weight="700" text-anchor="start">AMGEN MEDICINE EXPLORER  /  02</text>
<text x="60" y="109" font-family="Helvetica, Arial, sans-serif" font-size="39" fill="#072B50" font-weight="700" text-anchor="start">Data flow</text>
<text x="60" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4D667B" font-weight="400" text-anchor="start">Two separate flows: operator-controlled publication and a scoped, cited answer</text>
<rect x="60" y="185" width="1560" height="535" rx="14" fill="#EEF6FC" stroke="#B8D2E8" stroke-width="1.5"/>
<text x="85" y="224" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#072B50" font-weight="700" text-anchor="start">A  PREPARE AND PUBLISH A CORPUS</text>
<text x="85" y="254" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4D667B" font-weight="400" text-anchor="start">Local work stays local until the operator selects Load Pinecone. Blue cloud cards identify remote processing.</text>
<rect x="85" y="285" width="275" height="158" rx="14" fill="#FFFFFF" stroke="#B8D2E8" stroke-width="1.5"/>
<rect x="85" y="305" width="5" height="29" rx="2" fill="#0063C3"/>
<text x="107" y="327" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#072B50" font-weight="700" text-anchor="start">1  Source PDFs</text>
<text x="107" y="364" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">37 files / 36 products</text>
<text x="107" y="391" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">1,439 physical pages</text>
<text x="107" y="418" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Original bytes retained</text>
<rect x="390" y="285" width="275" height="158" rx="14" fill="#FFFFFF" stroke="#B8D2E8" stroke-width="1.5"/>
<rect x="390" y="305" width="5" height="29" rx="2" fill="#0063C3"/>
<text x="412" y="327" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#072B50" font-weight="700" text-anchor="start">2  Build XML</text>
<text x="412" y="364" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Existing local Python script</text>
<text x="412" y="391" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">One consolidated collection</text>
<text x="412" y="418" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">First-pass / unreviewed</text>
