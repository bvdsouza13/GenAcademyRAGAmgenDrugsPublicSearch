<text x="717" y="574" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Expected IDs and hashes</text>
<text x="717" y="601" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Records visible to search</text>
