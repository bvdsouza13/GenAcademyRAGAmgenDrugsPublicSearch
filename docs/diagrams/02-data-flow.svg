<text x="1022" y="364" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Section-aware boundaries</text>
<text x="1022" y="391" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Target 600 / overlap 80</text>
<text x="1022" y="418" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Preserve scope + qualifiers</text>
