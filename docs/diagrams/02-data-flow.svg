<text x="717" y="937" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Pinecone scoped search</text>
<text x="717" y="964" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Product / variant filters</text>
<text x="717" y="991" font-family="Helvetica, Arial, sans-serif" font-size="17.5" fill="#153B5C" font-weight="400" text-anchor="start">Return reviewed passages</text>
