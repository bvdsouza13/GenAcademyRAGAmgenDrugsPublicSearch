<text x="85" y="690" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4D667B" font-weight="400" text-anchor="start">Review decisions, chunk settings, build hashes and batch checkpoints are persisted locally. Rebuilds never auto-publish.</text>
<rect x="60" y="760" width="1560" height="309" rx="14" fill="#FFFFFF" stroke="#B8D2E8" stroke-width="1.5"/>
<text x="85" y="799" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#072B50" font-weight="700" text-anchor="start">B  ANSWER A LEARNER</text>
<text x="85" y="829" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4D667B" font-weight="400" text-anchor="start">Each answer uses one pinned, verified corpus through retrieval and citation resolution.</text>
<rect x="85" y="858" width="275" height="158" rx="14" fill="#FFFFFF" stroke="#B8D2E8" stroke-width="1.5"/>
<rect x="85" y="878" width="5" height="29" rx="2" fill="#0063C3"/>
